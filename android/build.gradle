buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.3.15")
    }
    subprojects { subproject ->
        afterEvaluate {
            if ((subproject.plugins.hasPlugin('android') || subproject.plugins.hasPlugin('android-library'))) {
                android {
                    compileSdkVersion rootProject.ext.compileSdkVersion
                    buildToolsVersion rootProject.ext.buildToolsVersion
                    ndkVersion rootProject.ext.ndkVersion
                    // AGP 9 dropped the global buildconfig gradle.properties flag.
                    buildFeatures {
                        buildConfig true
                    }
                }
            }
        }
    }
}

subprojects { subproject ->
    def configureAndroidModule = {
        subproject.android.ndkVersion = rootProject.ext.ndkVersion
        // AGP 9 dropped android.defaults.buildfeatures.buildconfig; enable on every module.
        subproject.android.buildFeatures.buildConfig = true
    }
    subproject.pluginManager.withPlugin('com.android.library', configureAndroidModule)
    subproject.pluginManager.withPlugin('com.android.application', configureAndroidModule)
}

apply plugin: "com.facebook.react.rootproject"